# lazygit: the lazygit terminal UI with the catppuccin-mocha theme, Nerd
# Font icons, and diffs rendered by delta (in the git package's catppuccin
# theme when that package is stowed; plain git colours without delta).
#
# Only what differs from lazygit's defaults (lazygit --config prints them).
# Everything else comes from git itself: the editor, and the git package's
# settings. lazygit writes state.yml next to this file; stow's --no-folding
# keeps it out of the repo. macOS reads ~/Library/Application Support/lazygit
# instead, so it needs a one-time link to this file (README).

gui:
  # Icons for files, branches and remotes. Needs a Nerd Font (v3) in the
  # terminal; without one they show as boxes. Delete this line then
  nerdFontsVersion: "3"

  # Catppuccin Mocha, blue accent, from catppuccin/lazygit (MIT) at commit
  # 1a4b26cbc2b5be05cc5494d0d7f764120a2cf86d, themes-mergable/mocha/blue.yml
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    searchingActiveBorderColor:
      - "#f9e2af"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#6c7086"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    cherryPickedCommitBgColor:
      - "#45475a"
    markedBaseCommitFgColor:
      - "#89b4fa"
    markedBaseCommitBgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    authorColors:
      "*": "#b4befe"

git:
  diffRenderers:
    # delta reads the [delta] section of git's config, so it picks up the
    # git package's catppuccin-mocha theme. --{{colorScheme}} is --dark or
    # --light, matched to the terminal. The git package turns on navigate,
    # which only labels files with a stray Δ here (lazygit's own docs: it
    # can't work inside lazygit), so it's off. Without delta, cat passes
    # git's own colours through, so the diff pane still works
    - command: >-
        if command -v delta >/dev/null 2>&1; then
        exec delta --{{colorScheme}} --paging=never --navigate=false;
        else exec cat; fi
