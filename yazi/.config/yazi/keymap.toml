# Keymap additions. prepend_keymap entries win over the preset for the same key.

# ! opens a shell here, from Yazi's "Dropping to the shell" tip; the preset
# has no such key. Yazi sets YAZI_ID and YAZI_LEVEL in it, which shell
# integrations (cd back to Yazi on exit, a prompt marker) look for.
[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

# pwsh.exe, not upstream's powershell.exe: win-config's profile is PowerShell
# 7 only, and 5.1 would open bare, without it.
[[mgr.prepend_keymap]]
on   = "!"
for  = "windows"
run  = 'shell "pwsh.exe" --block'
desc = "Open PowerShell here"

# smart-enter.yazi: l enters a directory or opens a file (preset: enter only).
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

# jump-to-char.yazi: vim-like f<char>. The preset's f (filter) moves to F, which is unbound.
[[mgr.prepend_keymap]]
on   = "f"
run  = "plugin jump-to-char"
desc = "Jump to char"

[[mgr.prepend_keymap]]
on   = "F"
run  = "filter --smart"
desc = "Filter files"
